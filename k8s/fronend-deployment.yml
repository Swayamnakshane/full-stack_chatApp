apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-deployment
  namespace: sim
  labels:
    app: front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      name: frontend-pod
      namespace: sim
      labels:
        app: front
    spec:
      containers:
      - name: frontend-chat
        image: swayamnakshane/chatfrontend
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: sim-configmap
              key: NODE_ENV
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config


