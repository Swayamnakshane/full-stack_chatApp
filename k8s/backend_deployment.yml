kind: Deployment
apiVersion: apps/v1
metadata:
  name: back-deployment
  namespace: sim
  labels:
    app: back
spec:
  replicas: 3
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
      - name: backend-pod
        image: swayamnakshane/chatbackend:latest
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: sim-configmap
              key: NODE_ENV

        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: sim-configmap
              key: MONGODB_URI

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sim-secret
              key: JWT_SECRET


        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"



